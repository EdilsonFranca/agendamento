
<div class="container-fluid p-0">
  <div class="row g-0 min-vh-100">

    <!-- Menu lateral / superior -->
    <aside
      class="col-12 col-lg-3 col-xl-2 sidebar p-3 p-lg-4 d-flex flex-column"
    >
      <!-- Marca -->
      <a routerLink="/" class="brand text-decoration-none mb-3 mb-lg-5">
        <span class="brand-icon me-2">↗</span>
        Transfere<span class="brand-plus">+</span>
      </a>

      <p class="menu-title mb-2 mb-lg-3">
        MENU PRINCIPAL
      </p>

      <!-- Navegação -->
      <nav class="nav d-flex flex-column ">
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link menu-link"
        >
          <span class="menu-icon me-2">⌂</span>
          Início
        </a>
        <!-- Lista -->
        <a
          routerLink="/transferencias"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link menu-link"
        >
          <span class="menu-icon me-2">⇄</span>
          <span>Lista</span>
        </a>

        <!-- Novo -->
        <a
          routerLink="/transferencias/novo"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link menu-link"
        >
          <span class="menu-icon me-2">＋</span>
          <span>Novo</span>
        </a>
      </nav>

      <!-- Rodapé do menu -->
      <div class="sidebar-footer mt-auto pt-4">
        <span class="online-dot me-2"></span>
        Sistema de transferências
        <small class="d-block mt-2 ms-4">
          Ambiente local
        </small>
      </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="col-12 col-lg main-area">
      <router-outlet />
    </main>

  </div>
</div>
